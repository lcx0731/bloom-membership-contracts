[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-membership-contracts"
version = "0.1.0"
description = "Partitioned Bloom filters with compatible unions, bounded persistence, and synthetic false-positive and deduplication audits"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.scripts]
bloom-audit = "bloom_contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
