name: tests-and-example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Test membership and persistence contracts
        run: python -m pytest -q
      - name: Reproduce complete synthetic audit
        run: python examples/demo.py --output /tmp/bloom-membership-results
      - name: Exercise installed command
        run: bloom-audit --items 4000 --queries 20000 --target 0.01 --seed 1729
